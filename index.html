<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>MedLink</title>
    <meta name="description" content="MedLink Project" />
    <meta name="author" content="MedLink" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="MedLink" />
    <meta property="og:description" content="MedLink Project" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Bibliotecas de exportacao carregadas via CDN (nao requerem npm install).
      jsPDF: gera documentos PDF no navegador
      jspdf-autotable: plugin para tabelas formatadas no PDF
      SheetJS (xlsx): gera arquivos .xlsx nativos do Excel
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!--
      qrcode-generator: gera QR Codes como imagens (data URL PNG) para embutir no PDF da receita.
      Expoe a funcao global qrcode(typeNumber, errorCorrectionLevel).
      html5-qrcode: usa a camera do dispositivo para ler QR Codes.
      Expoe a classe global Html5Qrcode para leitura via webcam/camera traseira.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </body>
</html>
